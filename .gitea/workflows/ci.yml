name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: 'package: build the artifact only | release: publish a previously built artifact as v{version.ini without -SNAPSHOT}'
        required: true
        default: 'package'
      package_run_id:
        description: 'Run ID that built the artifact (required when job=release)'
        required: false

permissions:
  contents: read

env:
  IMAGE_NAME: 'calibre-api'

jobs:
  ci-skip-check:
    runs-on: lab
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - name: Check for [skip-ci]
        id: check
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[skip-ci]"* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: ci-skip-check
    if: needs.ci-skip-check.outputs.should_skip == 'false'
    runs-on: lab
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with pylint
        run: |
          pip install pylint
          pylint src/

      - name: Test with pytest
        run: |
          pip install pytest
          pytest tests/ -v

  docker:
    needs: build
    runs-on: lab
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
